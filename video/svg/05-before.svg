<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 760" width="840" height="760"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect x="10" y="20" width="820" height="300" rx="18" fill="#0F172A" fill-opacity="0.92" stroke="#F87171" stroke-width="3"/><text x="40" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#F87171" font-weight="bold" text-anchor="start">PROMPT</text><text x="40" y="130" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="34" fill="#F9FAFB" font-weight="normal" text-anchor="start">Analyze our Q3 market data</text><text x="40" y="178" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="34" fill="#F9FAFB" font-weight="normal" text-anchor="start">and propose 5 strategies.</text><text x="40" y="250" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="30" fill="#9CA3AF" font-weight="normal" text-anchor="start">[ 4,000 rows of data pasted ]</text><line x1="420" y1="325" x2="420" y2="395" stroke="#9CA3AF" stroke-width="4" marker-end="url(#a)"/><rect x="10" y="400" width="820" height="340" rx="18" fill="#111827" fill-opacity="0.92" stroke="#374151" stroke-width="3"/><text x="40" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#9CA3AF" font-weight="bold" text-anchor="start">ANSWER</text><text x="40" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#F87171" font-weight="bold" text-anchor="start">✗  Numbers you can't trace</text><text x="40" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#F87171" font-weight="bold" text-anchor="start">✗  Generic, one-size strategies</text><text x="40" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#F87171" font-weight="bold" text-anchor="start">✗  No way to see where it broke</text></svg>