<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 760" width="840" height="760"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs><rect x="10" y="10" width="820" height="400" rx="18" fill="#0F172A" fill-opacity="0.92" stroke="#C084FC" stroke-width="3"/><text x="40" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#C084FC" font-weight="bold" text-anchor="start">DECOMPOSE WHEN</text><text x="40" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" fill="#F9FAFB" font-weight="bold" text-anchor="start">✓  Several stages</text><text x="40" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" fill="#F9FAFB" font-weight="bold" text-anchor="start">✓  Numbers or maths</text><text x="40" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" fill="#F9FAFB" font-weight="bold" text-anchor="start">✓  High-stakes decision</text><text x="40" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" fill="#F9FAFB" font-weight="bold" text-anchor="start">✓  Reasoning must be audited</text><rect x="10" y="440" width="820" height="310" rx="18" fill="#111827" fill-opacity="0.92" stroke="#374151" stroke-width="3"/><text x="40" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#9CA3AF" font-weight="bold" text-anchor="start">KEEP IT ONE PROMPT</text><text x="40" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#9CA3AF" font-weight="normal" text-anchor="start">–  Simple lookups</text><text x="40" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#9CA3AF" font-weight="normal" text-anchor="start">–  Quick rewrites</text><text x="40" y="703" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#9CA3AF" font-weight="normal" text-anchor="start">–  One-line answers</text></svg>